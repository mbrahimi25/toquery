name: API tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The tests validate request handling and do not connect to the database.
      # This placeholder is only needed because the app requires DATABASE_URL at import.
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API tests
        run: python -m pytest -q
