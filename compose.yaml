services:
  db:
    image: postgis/postgis:17-3.5
    container_name: geoquery-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: geoquery
      POSTGRES_USER: geoquery
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoquery -d geoquery"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: geoquery-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://geoquery:${DB_PASSWORD}@db:5432/geoquery
      CARTO_KEY: ${CARTO_KEY}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
