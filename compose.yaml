services:
  db:
    image: postgis/postgis:17-3.5
    container_name: geoquery-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: geoquery
      POSTGRES_USER: geoquery
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoquery -d geoquery"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
